<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CryptoAuto</title>
</head>

<body>

<h1>🚀 CryptoAuto Trading AI</h1>

<h2>Oportunidades do Mercado</h2>

<button onclick="loadOpportunities()">Buscar oportunidades</button>

<br><br>

<!-- 🔥 BOTÃO VIP -->
<button onclick="virarVIP()">🔥 Virar VIP</button>

<br><br>

<div id="results">Nenhum dado carregado</div>

<script>

const API = "https://cryptoauto-backend.onrender.com"

// ===============================
// 🔥 BUSCAR OPORTUNIDADES
// ===============================
async function loadOpportunities(){

 try {

  const response = await fetch(API + "/ai/opportunities-public")

  const json = await response.json()

  const results = document.getElementById("results")

  results.innerHTML = ""

  const coins = json.data || []

  if(coins.length === 0){
    results.innerHTML = "Nenhum dado disponível"
    return
  }

  coins.forEach(coin => {

    const div = document.createElement("div")

    div.innerHTML = `
      <b>${coin.name} (${coin.coin})</b><br>
      Preço: $${coin.price}<br>
      Sinal: ${coin.signal}<br>
      Confiança: ${coin.confidence}%<br>
      Score: ${coin.score}<br>
      <hr>
    `

    results.appendChild(div)

  })

 } catch (error) {

  document.getElementById("results").innerHTML = "Erro ao carregar"

 }

}

// ===============================
// 🔥 VIRAR VIP (BOLETO)
// ===============================
async function virarVIP(){

 try {

  const res = await fetch(API + "/payment/boleto")
  const data = await res.json()

  const results = document.getElementById("results")

  if(data.boletoUrl){

    results.innerHTML = `
      <h3>💰 Pagamento VIP</h3>
      <p>Clique no botão abaixo para pagar:</p>

      <a href="${data.boletoUrl}" target="_blank">
        <button>💸 Pagar agora</button>
      </a>

      <br><br>

      <small>Se não abrir, copie o link:</small><br>
      ${data.boletoUrl}
    `

  } else {

    results.innerHTML = "Erro ao gerar pagamento"

  }

 } catch (error) {

  document.getElementById("results").innerHTML = "Erro ao conectar com servidor"

 }

}

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CryptoAuto</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #0f172a;
  color: white;
}

button {
  padding: 10px 20px;
  margin: 10px;
  border: none;
  border-radius: 8px;
  background: #22c55e;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.card {
  background: #1e293b;
  padding: 15px;
  margin: 10px;
  border-radius: 10px;
}

.lock {
  color: red;
  font-size: 18px;
}

#status {
  margin: 10px;
  font-weight: bold;
}

.success {
  color: #22c55e;
  font-size: 20px;
  margin-top: 20px;
}

.cancel {
  color: red;
  font-size: 20px;
  margin-top: 20px;
}
</style>

</head>

<body>

<h1>🚀 CryptoAuto AI</h1>

<div id="paymentMessage"></div>

<button onclick="definirEmail()">👤 Entrar</button>
<button onclick="loadOpportunities()">📊 Buscar sinais</button>

<br>

<button onclick="virarVIP()">🔥 Virar VIP</button>

<div id="status"></div>
<div id="results">Nenhum dado carregado</div>

<script src="app.js"></script>

<script>

// ===============================
// 🔥 DETECTAR RETORNO DO STRIPE
// ===============================
const params = new URLSearchParams(window.location.search);
const messageDiv = document.getElementById("paymentMessage");

if (params.get("success")) {

  messageDiv.innerHTML = `
    <div class="success">
      <h1>Pagamento aprovado ✅</h1>
      <p>Você já é VIP. Volte ao app.</p>
    </div>
  `;

}

if (params.get("cancel")) {

  messageDiv.innerHTML = `
    <div class="cancel">
      <h1>Pagamento cancelado ❌</h1>
      <p>Tente novamente.</p>
    </div>
  `;

}

</script>

</body>
</html>

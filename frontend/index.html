<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CryptoAuto</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #0f172a;
  color: white;
}

button {
  padding: 10px 20px;
  margin: 10px;
  border: none;
  border-radius: 8px;
  background: #22c55e;
  color: white;
  font-weight: bold;
}

.vip {
  background: gold;
  color: black;
}

.card {
  background: #1e293b;
  padding: 15px;
  margin: 10px;
  border-radius: 10px;
}

.lock {
  color: red;
  font-size: 18px;
}
</style>

</head>

<body>

<h1>🚀 CryptoAuto AI</h1>

<button onclick="definirEmail()">👤 Entrar</button>
<button onclick="loadOpportunities()">📊 Buscar sinais</button>

<br>

<button class="vip" onclick="virarVIP()">🔥 Virar VIP</button>

<div id="status"></div>
<div id="results">Nenhum dado carregado</div>

<script>

const API = "https://cryptoauto-backend.onrender.com"

let userEmail = localStorage.getItem("email") || null;
let isVIP = false;

// ===============================
// 👤 DEFINIR EMAIL
// ===============================
function definirEmail(){

  const email = prompt("Digite seu email:");

  if(!email){
    alert("Email obrigatório");
    return;
  }

  localStorage.setItem("email", email);
  userEmail = email;

  verificarVIP();
}

// ===============================
// 🔒 VERIFICAR VIP REAL
// ===============================
async function verificarVIP(){

 if(!userEmail) return;

 try {

  const res = await fetch(
    API + "/user/status?email=" + encodeURIComponent(userEmail)
  );

  const data = await res.json();

  isVIP = data.isVIP;

  const status = document.getElementById("status");

  if(isVIP){
    status.innerHTML = "💎 VIP ATIVO (" + data.plan + ")";
  } else {
    status.innerHTML = "🔒 Conta Free";
  }

 } catch (error) {
  console.log("Erro ao verificar VIP");
 }

}

// ===============================
// 📊 BUSCAR SINAIS
// ===============================
async function loadOpportunities(){

 try {

  const response = await fetch(API + "/ai/opportunities-public");
  const json = await response.json();

  const results = document.getElementById("results");
  results.innerHTML = "";

  const coins = json.data || [];

  if(coins.length === 0){
    results.innerHTML = "Nenhum dado disponível";
    return;
  }

  coins.forEach(coin => {

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>${coin.name} (${coin.coin})</b><br>
      Preço: $${coin.price}<br>
      Sinal: ${coin.signal}<br>
      Confiança: ${coin.confidence}%<br>
    `;

    results.appendChild(div);

  });

  // 🔒 BLOQUEIO
  if(!isVIP){

    const lock = document.createElement("div");
    lock.className = "card";

    lock.innerHTML = `
      <div class="lock">🔒 Conteúdo VIP</div>
      <p>Desbloqueie todos os sinais</p>
      <button onclick="virarVIP()">🔥 Assinar agora</button>
    `;

    results.appendChild(lock);
  }

 } catch (error) {
  document.getElementById("results").innerHTML = "Erro ao carregar";
 }

}

// ===============================
// 💰 PAGAMENTO
// ===============================
async function virarVIP(){

 if(!userEmail){
  alert("Defina seu email primeiro");
  return;
 }

 try {

  const res = await fetch(
    API + "/payment/boleto?email=" + encodeURIComponent(userEmail)
  );

  const data = await res.json();

  const results = document.getElementById("results");

  if(data.boletoUrl){

    results.innerHTML = `
      <h2>💰 Pagamento VIP</h2>
      <p>Email: ${data.email}</p>

      <a href="${data.boletoUrl}" target="_blank">
        <button>💸 Pagar agora</button>
      </a>

      <br><br>
      <small>Após pagamento o VIP libera automaticamente</small>
    `;

  } else {
    results.innerHTML = "Erro ao gerar pagamento";
  }

 } catch (error) {
  alert("Erro ao conectar");
 }

}

// 🔥 AUTO LOGIN
if(userEmail){
  verificarVIP();
}

</script>

</body>
</html>

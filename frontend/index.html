<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CryptoAuto</title>
</head>

<body>

<h1>🚀 CryptoAuto Trading AI</h1>

<h2>Área do Usuário</h2>

<!-- 🔥 BOTÃO ENTRAR -->
<button onclick="verificarVIP()">Entrar</button>

<br><br>

<div id="results">Nenhum dado carregado</div>

<script>

const API = "https://cryptoauto-backend.onrender.com"

// ===============================
// 🔐 VERIFICAR VIP
// ===============================
async function verificarVIP(){

 const email = prompt("Digite seu email:");

 if(!email){
  alert("Email obrigatório");
  return;
 }

 try {

  const res = await fetch(
    API + "/user/vip?email=" + encodeURIComponent(email)
  );

  const data = await res.json();

  const results = document.getElementById("results");

  // 🔒 NÃO É VIP
  if(!data.vip){

    results.innerHTML = `
      <h3>🔒 Conteúdo VIP</h3>
      <p>Você ainda não é VIP</p>

      <button onclick="virarVIP('${email}')">
        🔥 Virar VIP
      </button>

      <br><br>

      <button onclick="loadOpportunities()">
        👀 Ver versão grátis
      </button>
    `;

  } else {

    // 🔓 VIP LIBERADO
    loadVIP(email);

  }

 } catch (error) {

  document.getElementById("results").innerHTML = "Erro ao verificar acesso";

 }

}

// ===============================
// 🔥 CARREGAR FREE
// ===============================
async function loadOpportunities(){

 try {

  const response = await fetch(API + "/ai/opportunities-public")

  const json = await response.json()

  const results = document.getElementById("results")

  results.innerHTML = "<h3>🚀 Sinais FREE</h3>"

  const coins = json.data || []

  if(coins.length === 0){
    results.innerHTML += "Nenhum dado disponível"
    return
  }

  coins.forEach(coin => {

    results.innerHTML += `
      <b>${coin.name} (${coin.coin})</b><br>
      Preço: $${coin.price}<br>
      Sinal: ${coin.signal}<br>
      Confiança: ${coin.confidence}%<br>
      <hr>
    `

  })

 } catch (error) {

  document.getElementById("results").innerHTML = "Erro ao carregar"

 }

}

// ===============================
// 🔓 CARREGAR VIP
// ===============================
async function loadVIP(email){

 try {

  const response = await fetch(API + "/ai/opportunities-public")

  const json = await response.json()

  const results = document.getElementById("results")

  results.innerHTML = `
    <h3>💎 Área VIP</h3>
    <p>Bem-vindo: ${email}</p>
  `

  const coins = json.data || []

  if(coins.length === 0){
    results.innerHTML += "Nenhum dado disponível"
    return
  }

  coins.forEach(coin => {

    results.innerHTML += `
      <b>${coin.name} (${coin.coin})</b><br>
      Preço: $${coin.price}<br>
      Sinal: ${coin.signal}<br>
      Confiança: ${coin.confidence}%<br>
      Score: ${coin.score}<br>
      <hr>
    `

  })

 } catch (error) {

  document.getElementById("results").innerHTML = "Erro ao carregar VIP"

 }

}

// ===============================
// 💰 VIRAR VIP (BOLETO)
// ===============================
async function virarVIP(email){

 if(!email){
  alert("Email obrigatório");
  return;
 }

 try {

  const res = await fetch(
    API + "/payment/boleto?email=" + encodeURIComponent(email)
  );

  const data = await res.json();

  const results = document.getElementById("results");

  if(data.boletoUrl){

    results.innerHTML = `
      <h3>💰 Pagamento VIP</h3>
      <p>Email: ${data.email}</p>

      <a href="${data.boletoUrl}" target="_blank">
        <button>💸 Pagar agora</button>
      </a>

      <br><br>
      <small>Após o pagamento, seu acesso será liberado automaticamente</small>
    `;

  } else {
    results.innerHTML = "Erro ao gerar pagamento";
  }

 } catch (error) {
  alert("Erro ao conectar");
 }

}

</script>

</body>
</html>
